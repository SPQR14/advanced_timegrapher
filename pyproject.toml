[build-system]
requires = ["setuptools>=68.0", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-timegrapher"
version = "0.6.1"
description = "Software timegrapher for mechanical watches (PyQt6 GUI; measurement core under reconstruction)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Alberto Pico Lara" }
]
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.14.0",  # WAV/FLAC I/O; wheels bundle libsndfile (LGPL-2.1, dynamic)
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "PyOpenGL",
    "PyOpenGL_accelerate",
]

[project.optional-dependencies]
fallback = [
    "scipy>=1.11",  # pure-Python DSP fallback if native C++ extension is absent
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-qt",
    "scipy>=1.11",  # reference implementation in the DSP tests only (not used at runtime)
    "pre-commit",
]
# Gráficas de análisis (detect_beats --plot): pip install -e ".[plot]"
plot = [
    "matplotlib>=3.8",
]

[project.scripts]
adv-tg = "adv_tg.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adv_tg*"]

[tool.setuptools.package-data]
"adv_tg.ui" = ["assets/*"]
"adv_tg.utils" = ["db/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E = pycodestyle, F = Pyflakes (imports/variables sin usar), I = isort (orden de imports)
select = ["E", "F", "I"]

ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux_* pp*"
test-requires = ["pytest", "scipy"]
test-command = "pytest {project}/tests/test_native_dsp.py -q"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
