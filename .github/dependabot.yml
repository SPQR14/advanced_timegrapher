version: 2
updates:
  # Monitoreo de dependencias de Python (PyQt6, NumPy, soundfile, sounddevice, etc.)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
      - "python"
    commit-message:
      prefix: "deps(python)"
      include: "scope"

  # Monitoreo de dependencias de GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
      - "github-actions"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"
