name: Build & Package Release

on:
  push:
    branches: [ "main", "release/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dist:
    name: Build pure-Python wheel & sdist
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
          # The project is pure Python: the wheel must be py3-none-any (no compiled code)
          ls dist/*-py3-none-any.whl

      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build:
    name: Build App on ${{ matrix.os }} (${{ matrix.arch }})
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            artifact_name: adv-tg-linux-x86_64.tar.gz
          - os: macos-latest
            platform: macos
            arch: arm64
            artifact_name: adv-tg-macos-arm64.zip
          - os: windows-latest
            platform: windows
            arch: x64
            artifact_name: adv-tg-windows-x64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libasound2t64 libegl1 libgl1 rpm

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build with PyInstaller
        run: |
          pyinstaller packaging/adv-tg.spec --noconfirm

      - name: Verify SciPy is excluded from binary bundle
        shell: bash
        run: |
          python -c "import glob, sys; f = glob.glob('dist/**/scipy*', recursive=True); sys.exit('SciPy was bundled in dist: ' + str(f)) if f else print('OK: No SciPy found in dist bundle')"

      - name: Smoke Test Binary (Linux)
        if: matrix.platform == 'linux'
        run: |
          xvfb-run -a ./dist/adv-tg/adv-tg --version
          xvfb-run -a ./dist/adv-tg/adv-tg --smoke-test

      - name: Smoke Test Binary (macOS)
        if: matrix.platform == 'macos'
        run: |
          export QT_QPA_PLATFORM=offscreen
          "./dist/Advanced Timegrapher.app/Contents/MacOS/adv-tg" --version
          "./dist/Advanced Timegrapher.app/Contents/MacOS/adv-tg" --smoke-test
          ./dist/adv-tg/adv-tg --smoke-test

      - name: Smoke Test Binary (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          .\dist\adv-tg\adv-tg.exe --version
          .\dist\adv-tg\adv-tg.exe --smoke-test

      - name: Package Binaries (Linux)
        if: matrix.platform == 'linux'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C dist adv-tg
          chmod +x packaging/linux/build_rpm.sh
          ./packaging/linux/build_rpm.sh

      - name: Package Binaries (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd dist && zip -r -y ../${{ matrix.artifact_name }} "Advanced Timegrapher.app"
          cd ..
          chmod +x packaging/macos/build_dmg.sh
          ./packaging/macos/build_dmg.sh "dist/Advanced Timegrapher.app" "dist/adv-tg-macos-arm64.dmg"

      - name: Package Binaries (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\adv-tg -DestinationPath ${{ matrix.artifact_name }}

      - name: Build Windows Installer (Inno Setup)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          $version = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
              iscc "/DMyAppVersion=$version" packaging\windows\installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\windows\installer.iss
          } else {
              throw "Inno Setup compiler (ISCC) not found"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Upload macOS DMG Artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adv-tg-macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload Windows Installer Artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adv-tg-windows-x64-installer
          path: dist/*setup.exe
          if-no-files-found: error

      - name: Upload Linux RPM Artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adv-tg-linux-rpm
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [python-dist, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
          merge-multiple: true

      # Users verify downloads with: sha256sum -c SHA256SUMS.txt --ignore-missing
      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
