name: Tests

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests (${{ matrix.os }})
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libasound2t64 libegl1 libgl1

      - name: Install dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest (Linux headless)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a pytest tests/

      - name: Run Pytest (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          pytest tests/

  run-unit-tests:
    name: Run Unit Tests
    needs: test
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && always()
    steps:
      - name: Verify All Platform Tests Passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Unit tests failed on one or more platforms (Ubuntu, macOS, Windows)!"
            exit 1
          fi
          echo "All unit tests passed successfully on ubuntu-latest, macos-latest, and windows-latest!"
