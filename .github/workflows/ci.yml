name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "release/*" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libportaudio2 y libasound2t64 (Ubuntu 24.04+) para audio; xvfb, xcb y gl/egl para PyQt6/PyOpenGL headless
          sudo apt-get install -y libportaudio2 xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libasound2t64 libegl1 libgl1

      - name: Install Python Dependencies (with C++ native extension)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e .[dev,fallback]

      - name: Lint and Format with Ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run Pytest (Linux headless)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a pytest -v --cov=adv_tg

      - name: Run Pytest (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          pytest -v --cov=adv_tg

  test-fallback:
    name: Test Pure-Python Fallback (ADV_TG_SKIP_NATIVE=1)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libasound2t64 libegl1 libgl1

      - name: Install without C++ Extension
        run: |
          python -m pip install --upgrade pip
          ADV_TG_SKIP_NATIVE=1 pip install -e .[dev,fallback]

      - name: Run Pytest Fallback (headless)
        run: |
          xvfb-run -a pytest -v tests/test_native_dsp.py tests/test_beat_detector_physics.py
