name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "release/*" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libportaudio2 y libasound2t64 (Ubuntu 24.04+) para audio; xvfb, xcb y gl/egl para PyQt6/PyOpenGL headless
          sudo apt-get install -y libportaudio2 xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libasound2t64 libegl1 libgl1 cmake ninja-build g++

      - name: Install Python Dependencies (no SciPy)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e .[dev]

      # Tuned for the runner CPU (x86_64 on Linux/Windows, NEON on Apple Silicon macOS); the
      # suite then runs on the native engine, including the zero-tolerance parity tests
      # against the Python reference (tests/test_native_*.py).
      - name: Build Native C++20 Engine
        shell: bash
        run: |
          python scripts/build_native.py --target native
          PYTHONPATH=src python -c "from adv_tg import native_bridge as nb; from adv_tg.core.native_session import native_session_available as ok; assert nb.is_native_available() and ok(), 'native engine not loaded'; print(nb.native_arch_info())"

      - name: Build mobile configuration on the host (static, no PortAudio, C99 example)
        if: runner.os == 'Linux'
        run: |
          cmake -S native -B build/mobile_host -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADVTG_WITH_AUDIO_CAPTURE=OFF -DADVTG_STATIC=ON -DADVTG_BUILD_EXAMPLES=ON
          cmake --build build/mobile_host
          gcc -std=c99 -Wall -Wextra -pedantic -Werror -fsyntax-only -x c native/include/advtg.h

      - name: Lint and Format with Ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run Pytest (Linux headless)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a pytest -v --cov=adv_tg

      - name: Run Pytest (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          pytest -v --cov=adv_tg
